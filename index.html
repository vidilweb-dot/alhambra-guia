<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audioguía · La Alhambra</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2312202a%22/><path d=%22M50 20 l4 8 8 1 -6 6 1.5 8 -7.5 -4 -7.5 4 1.5 -8 -6 -6 8 -1z%22 fill=%22%23b8923f%22/></svg>">
</head>
<body>

<header>
  <div class="eyebrow">Audioguía · La Alhambra</div>
  <svg class="tile-ring" id="tileRing" viewBox="0 0 400 60"></svg>
  <div class="cache-banner" id="cacheBanner">Preparando audios para uso sin cobertura…</div>
</header>

<main>
  <div class="stop-illustration" id="stopIllustration"></div>
  <div class="stop-counter mono" id="stopCounter">PARADA 1 DE 14</div>
  <div class="stop-context" id="stopContext"></div>
  <h1 class="stop-title" id="stopTitle"></h1>
  <p class="stop-summary" id="stopSummary"></p>

  <div class="transport">
    <button class="skip-btn" id="prevBtn" aria-label="Parada anterior">
      <svg viewBox="0 0 24 24"><path d="M15.5 5l-7 7 7 7 1.4-1.4L11.3 12l5.6-5.6z"/></svg>
    </button>
    <button class="play-btn" id="playBtn" aria-label="Reproducir">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="skip-btn" id="nextBtn" aria-label="Siguiente parada">
      <svg viewBox="0 0 24 24"><path d="M8.5 5l7 7-7 7-1.4-1.4L12.7 12 7.1 6.4z"/></svg>
    </button>
  </div>

  <div class="scrub-row">
    <span class="time mono" id="timeCurrent">0:00</span>
    <input type="range" id="scrub" min="0" max="100" value="0">
    <span class="time mono" id="timeTotal">0:00</span>
  </div>
</main>

<button class="list-toggle" id="mapToggle">Ver plano del recorrido ▾</button>

<button class="list-toggle" id="listToggle">Ver las 14 paradas ▾</button>
<div class="stop-list" id="stopList"></div>

<div class="chat-panel" id="mapImagePanel">
  <div class="chat-sheet map-image-sheet">
    <div class="chat-header">
      <strong>Plano del recorrido</strong>
      <button class="chat-close" id="mapImageClose" aria-label="Cerrar">✕</button>
    </div>
    <div class="map-image-scroll">
      <img src="images/plano.jpg" alt="Plano de la Alhambra con el recorrido y las 14 paradas marcadas">
    </div>
  </div>
</div>

<button class="chat-fab" id="chatFab" aria-label="Preguntar">
  <svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3z"/></svg>
</button>

<div class="chat-panel" id="chatPanel">
  <div class="chat-sheet">
    <div class="chat-header">
      <strong>Pregunta lo que quieras</strong>
      <button class="chat-close" id="chatClose" aria-label="Cerrar">✕</button>
    </div>
    <span style="padding:6px 18px 0; font-size:12px; color:var(--muted)" id="chatContextLabel"></span>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ej: ¿por qué hay leones en la fuente?">
      <button class="send-btn" id="sendBtn" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<audio id="player"></audio>

<script src="js/stops.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
